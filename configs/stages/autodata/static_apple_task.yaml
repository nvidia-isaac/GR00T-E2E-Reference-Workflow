# Task descriptor for amplifying this repository's static apple recordings with DexMimicGen.
#
# The subtask split follows AutoData's G1 pick-and-place example, because the motion is the same
# shape: the right hand does the transfer in two phases while the left hand only supports. The
# object reference is the scene entity name our env cfg registers the apple under.
#
# `right_hand_holds_object` names the boolean observation term the AutoData env variant publishes
# in its `subtask_terms` group, which is what lets annotation find this boundary itself rather
# than pausing for someone to mark it in the viewer.

name: g1_static_apple_transfer
description: G1 picks an apple off the table with its right hand and places it on the plate.
algo: dexmimicgen

generation_policy:
  name: g1_static_apple_transfer
  seed: 1
  num_trials: 1000
  guarantee_success: true
  keep_failed: false
  source_dataset_path: null
  generation_path: null
  task_name: null
  use_skillgen: false
  use_navigation_controller: false
  select_src_per_subtask: false
  select_src_per_arm: false
  transform_first_robot_pose: false
  interpolate_from_last_target_pose: true

subtasks:
  right:
    - object_ref: object
      description: Approach and grasp the apple with the right hand.
      subtask_term_signal: right_hand_holds_object
      first_subtask_start_offset_range: [0, 0]
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      action_noise: 0.003
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false

    # Final subtask: ends with the trajectory, so it needs no termination signal.
    - object_ref: object
      description: Transport the apple to the plate and release it.
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      action_noise: 0.003
      num_interpolation_steps: 3
      num_fixed_steps: 0
      apply_noise_during_interpolation: false

  left:
    # Single subtask spanning the whole trajectory: the left hand only steadies the posture.
    - object_ref: object
      description: Left-hand support motion throughout the transfer.
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 3
      action_noise: 0.003
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
