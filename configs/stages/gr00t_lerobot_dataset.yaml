data_root: ./datasets
language_instruction: move the apple to the plate
task_index: 3
hdf5_name: e2e_ra_dataset.hdf5

# Which converter writes this dataset, as "module:function" with the contract
# write(hdf5_path, config, output_root) -> summary dict. This is a GR00T LeRobot
# dataset; a future VLA/policy target adds its own stage config pointing at its
# own writer, selected via --config.
writer: e2e_robot_workflows.gr00t.lerobot_writer:write_lerobot_dataset

manifest_admission:
  required: false
  accepted_profiles:
    - {lane: native, controller: pink_fixed, layout: native_g1_pink_fixed_28d_v1}
    - {lane: native, controller: pink_agile, layout: native_g1_pink_agile_32d_v1}
    - {lane: arena, controller: g1_wbc_agile_pink, layout: arena_g1_wbc_agile_pink_23d_v1}
    - {lane: arena, controller: g1_wbc_agile_joint, layout: arena_g1_wbc_agile_joint_50d_v1}
  unmanifested_action_widths: [23, 28, 32, 50]

# Pose observations recorded with Isaac Lab 3 use XYZW quaternions.
hdf5_fields:
  state: robot_joint_pos
  # The articulation's joint position command, added to the recorder on every path by
  # add_workflow_recorder_terms. It means the same thing whichever controller produced
  # it: combined Pink IK (upper) + AGILE (lower) here, joint targets under Arena's
  # joint embodiment.
  action: joint_pos_target
  video: robot_head_cam_rgb
  left_eef_pos: left_eef_pos
  left_eef_quat: left_eef_quat
  right_eef_pos: right_eef_pos
  right_eef_quat: right_eef_quat
  base_height_command: base_height_cmd
  navigate_command: navigate_cmd

required_fields: [state, action, video]
optional_fields:
  - left_eef_pos
  - left_eef_quat
  - right_eef_pos
  - right_eef_quat
  - base_height_command
  - navigate_command

lerobot_fields:
  state: observation.state
  action: action
  video: observation.images.ego_view
  task_description: annotation.human.task_description
  # Optional low-dim columns written verbatim (no joint remap) when the recorded
  # field is present; GR00T's action head reads these via modality.json.
  navigate_command: teleop.navigate_command
  base_height_command: teleop.base_height_command

# Columns assembled by concatenating several recorded fields in order, emitted
# only when every part is present. observation.eef_pose = achieved left/right
# wrist pose (pos+quat each).
assembled_columns:
  observation.eef_pose: [left_eef_pos, left_eef_quat, right_eef_pos, right_eef_quat]

robot:
  type: unitree_g1
  policy_joints_config_path: configs/stages/gr00t/gr00t_43dof_joint_space.yaml
  action_joints_config_path: configs/stages/gr00t/43dof_joint_space.yaml
  state_joints_config_path: configs/stages/gr00t/43dof_joint_space.yaml

video:
  fps: 50
  original_image_size: [480, 640, 3]
  target_image_size: [480, 640, 3]

paths:
  data_path: data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet
  video_path: videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4
  modality_template_path: configs/stages/gr00t/modality.json
  info_template_path: configs/stages/gr00t/info.json
