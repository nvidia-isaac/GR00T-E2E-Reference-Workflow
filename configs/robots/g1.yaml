controller_profiles_path: configs/robots/g1_controller_profiles.yaml
default_record_profile: g1_isaaclab_pink_ik_static
planned_stabilized_record_profile: g1_pink_ik_agile_stabilized
default_eval_profile: g1_isaaclab_pink_ik_static

recording:
  wbc_mode: fixed
  enable_waist: false
  xr_anchor_position: [0.0, 0.0, -0.30]
  # Match initial_pose.rotation_xyzw so a headset recenter faces the robot.
  xr_anchor_rotation_xyzw: [0.0, 0.0, 0.70711, 0.70711]

# Robot pose is an embodiment binding, not part of the shared environment.
initial_pose:
  position_xy: [0.0, -0.01]
  rotation_xyzw: [0.0, 0.0, 0.70711, 0.70711]

# Robot-specific body names used by static-apple grasp/release predicates.
task_link_names: [left_hand_thumb_2_link, right_hand_thumb_2_link]

standing:
  pelvis_height_m: 0.792
  leg_joint_pos:
    .*_hip_pitch_joint: -0.10
    .*_hip_roll_joint: 0.0
    .*_hip_yaw_joint: 0.0
    .*_knee_joint: 0.30
    .*_ankle_pitch_joint: -0.20
    .*_ankle_roll_joint: 0.0
  base_leg_joint_patterns: [".*_hip_.*", ".*_knee_.*", ".*_ankle_.*"]

usd: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/Samples/Groot/Robots/g1_29dof_with_hand_rev_1_0.usd"

head_camera:
  prim: head_link/RobotHeadCam
  offset_pos: [0.04485, 0.0, 0.35325]
  offset_rot_xyzw: [-0.62721, 0.62721, -0.32651, 0.32651]
  width: 640
  height: 480
  focal_length: 15.0
  clipping_range: [0.1, 5.0]

open_arm_joint_pos:
  left_shoulder_roll_joint: 0.35
  right_shoulder_roll_joint: -0.35
  left_shoulder_yaw_joint: 0.5
  right_shoulder_yaw_joint: -0.5

finger_friction:
  material_path: /World/Materials/g1_static_object_transfer_high_friction_fingers
  # Rubber/silicone fingertip coefficients (record + eval).
  static_friction: 1.0
  dynamic_friction: 0.8
  prim_name_markers: [hand, thumb, index, middle]
