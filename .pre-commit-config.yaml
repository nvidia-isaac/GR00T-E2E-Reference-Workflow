minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--enforce-all", "--maxkb=1024"]
        exclude: '^docs/images/(real-robot-teleop-example[.]gif|unitree-top-down[.]jpg)$'
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: ["--fix", "--no-cache"]
      - id: ruff-format
        args: ["--no-cache"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: bash-syntax
        name: bash syntax
        entry: bash -c 'for file do bash -n "$file" || exit 1; done' --
        language: system
        types: [shell]
