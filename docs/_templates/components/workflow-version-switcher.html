{% set button_id = unique_html_id("workflow-version-button") %}
{% set menu_id = unique_html_id("workflow-version-menu") %}
<div class="version-switcher__container dropdown workflow-version-switcher"
     data-catalog-url="{{ docs_catalog_url | e }}" data-version="{{ docs_version | e }}"
     data-page="{{ pagename | e }}{{ file_suffix | e }}">
  <button id="{{ button_id }}" type="button"
          class="version-switcher__button btn btn-sm dropdown-toggle"
          data-bs-toggle="dropdown" aria-expanded="false"
          aria-controls="{{ menu_id }}" aria-label="Documentation version">
    {{ docs_version_label | e }}
  </button>
  <div id="{{ menu_id }}" class="version-switcher__menu dropdown-menu dropdown-menu-end list-group-flush py-0"
       aria-labelledby="{{ button_id }}">
    {% for entry in docs_versions %}
    <a class="dropdown-item list-group-item list-group-item-action py-1{% if entry.version == docs_version %} active{% endif %}"
       href="{{ entry.url | e }}{{ pagename | e }}{{ file_suffix | e }}"
       data-version="{{ entry.version | e }}" data-home="{{ entry.url | e }}">{{ entry.name | e }}</a>
    {% endfor %}
  </div>
</div>
