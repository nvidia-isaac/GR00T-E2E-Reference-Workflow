name: Publish documentation

on:
  push:
    branches: [main, release/v0.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  UV_PYTHON_PREFERENCE: system

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      main_sha: ${{ steps.sources.outputs.main_sha }}
      release_sha: ${{ steps.sources.outputs.release_sha }}
    steps:
      - name: Check private Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.public')" = false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref == 'refs/heads/main' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref == 'refs/heads/release/v0.2' && github.sha || 'release/v0.2' }}
          path: release-source
          persist-credentials: false
      - name: Record source commits
        id: sources
        run: |
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.9.5
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build main documentation
        env:
          DOCS_KIND: development
          DOCS_REF: main
          PAGES_PREFIX: ''
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          uv sync --frozen --no-default-groups --only-group docs
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF_NAME=main GITHUB_REF_TYPE=branch \
            uv run --no-sync python -m sphinx -a -E -n -W --keep-going -b html -d _build/doctrees docs _site
      - name: Build v0.2 documentation
        working-directory: release-source
        env:
          DOCS_KIND: release
          DOCS_REF: release/v0.2
          PAGES_PREFIX: v0-2
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          uv sync --frozen --no-default-groups --only-group docs
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF_NAME=release/v0.2 GITHUB_REF_TYPE=branch \
            uv run --no-sync python -m sphinx -a -E -n -W --keep-going -b html -d _build/doctrees docs ../_site/v0-2
      - name: Upload complete documentation site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify privacy and source freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.build.outputs.main_sha }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.public')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.2" --jq '.object.sha')" = "$RELEASE_SHA"
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
